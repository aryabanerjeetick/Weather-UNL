<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weatherspan — now, next 2 years, past 2 years</title>
<meta name="description" content="Current conditions and a 16-day forecast for any place on earth, plus climate-model projections two years ahead and observed reanalysis two years back.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9B%85%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⛅</span>
    <span class="brand-name">Weatherspan</span>
  </div>

  <form class="search" id="search-form" role="search" autocomplete="off">
    <label class="sr-only" for="place-input">Search for a city, town or place</label>
    <input id="place-input" type="text" placeholder="Search any city, town or place…"
           role="combobox" aria-expanded="false" aria-controls="place-list"
           aria-autocomplete="list" spellcheck="false">
    <ul id="place-list" class="suggestions" role="listbox" aria-label="Place suggestions" hidden></ul>
    <button type="submit" class="btn btn-primary">Search</button>
    <button type="button" class="btn" id="geo-btn" title="Use my current location">
      <span aria-hidden="true">◎</span><span class="btn-text">My location</span>
    </button>
  </form>

  <button type="button" class="btn btn-icon" id="theme-btn" aria-label="Switch colour theme">
    <span id="theme-glyph" aria-hidden="true">◐</span>
  </button>
</header>

<div id="status" class="status" role="status" aria-live="polite"></div>

<main id="main">
  <section class="place-head" id="place-head" hidden>
    <h1 id="place-name">—</h1>
    <p class="place-meta" id="place-meta"></p>
  </section>

  <!-- One filter row, above everything it scopes -->
  <div class="filterbar" id="filterbar" role="group" aria-label="Display options" hidden>
    <div class="segmented" role="radiogroup" aria-label="Units">
      <button type="button" role="radio" aria-checked="true" data-unit="metric">°C · mm · km/h</button>
      <button type="button" role="radio" aria-checked="false" data-unit="imperial">°F · in · mph</button>
    </div>
    <div class="segmented" role="radiogroup" aria-label="Resolution of the two-year charts">
      <button type="button" role="radio" aria-checked="true" data-grain="monthly">Monthly</button>
      <button type="button" role="radio" aria-checked="false" data-grain="daily">Daily</button>
    </div>
    <p class="filter-note" id="filter-note">Scopes every chart below.</p>
  </div>

  <div id="app" class="stack"></div>
</main>

<footer class="footer">
  <p>Data: <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a> — forecast (ICON/GFS/ECMWF blend), ERA5 reanalysis for history, and bias-corrected CMIP6 downscaled models for the two-year outlook. Geocoding by Open-Meteo / GeoNames. No API key, no tracking.</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
